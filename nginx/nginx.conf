user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 1m;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # WebSocket upgrade map (Socket.IO 필수)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # CloudFront 경유 시 X-Forwarded-For 첫 번째 IP를 실제 클라이언트 IP로 사용
  # origin-api 는 CloudFront가 proxy 이므로 $remote_addr 은 CloudFront IP
  map $http_x_forwarded_for $real_client_ip {
    ~^([^,\s]+) $1;
    default     $binary_remote_addr;
  }

  # [A] origin-api — CloudFront 경유 HTTP API (IP당 20r/s, burst 30)
  limit_req_zone $real_client_ip    zone=api_limit:10m rate=20r/s;

  # [B] ws — 브라우저 직접 WebSocket 연결 요청 (IP당 1r/s, burst 10)
  limit_req_zone $binary_remote_addr zone=ws_limit:10m  rate=1r/s;

  # rate limit 초과 시 429 반환
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
