services:
  redis:
    image: redis:7-alpine
    container_name: rullette-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rullette-app
    environment:
      NODE_ENV: production
      PORT: '8080'
      # Docker Compose 내부에서 서비스명으로 연결
      REDIS_URL: 'redis://redis:6379'
      # 프론트엔드 URL (필요시 수정)
      FRONTEND_URL: 'http://localhost:3000'
      # CORS 설정 (필요시 수정)
      CORS_ORIGIN: '["http://localhost:3000"]'
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
